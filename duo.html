<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Duo</title>
<link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
<style>
  body { margin:0; background:#333; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial, sans-serif; }
  canvas { border:4px solid #111; }
  .life { position:absolute; top:10px; width:30px; height:30px; }
  #myLives { left:10px; }
  #enemyLives { right:10px; }
</style>
</head>
<body>

<img src="assets/logohome.png" style="position:fixed; top:10px; left:10px; width:105px; cursor:pointer;" onclick="window.location.href='./index.html'">
<img src="assets/logorefresh.png" style="position:fixed; top:10px; right:10px; width:105px; cursor:pointer;" onclick="window.location.reload()">

<div id="game-wrapper"></div>
<div id="myLives"></div>
<div id="enemyLives"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // ======== Firebase ========
  const firebaseConfig = {
    apiKey: "AIzaSyA-LI-eVf069LVpkybZh1PBvDKgE_r-WKE",
    authDomain: "bombgo-duo.firebaseapp.com",
    projectId: "bombgo-duo",
    storageBucket: "bombgo-duo.firebasestorage.app",
    messagingSenderId: "145372656449",
    appId: "1:145372656449:web:8c2df41a5911d76757a7c0"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ======== Device et pseudo ========
  let deviceId = localStorage.getItem("deviceId");
  if(!deviceId){ deviceId = crypto.randomUUID(); localStorage.setItem("deviceId", deviceId); }
  const playerNickname = localStorage.getItem("playerNickname") || "player";

  // ======== Matchmaking ========
  let roomId = null;
  let playerNumber = 1; // 1 ou 2
  async function joinRoom() {
    const rooms = await db.collection("rooms").where("full","==",false).get();
    if(rooms.empty){
      // Créer une nouvelle room
      const roomRef = await db.collection("rooms").add({full:false});
      roomId = roomRef.id;
      playerNumber = 1;
      db.collection("players").doc(deviceId).set({
        room: roomId,
        pseudo: playerNickname,
        number: 1,
        x:100,
        y:450,
        score:0,
        lives:3
      });
    } else {
      // Rejoindre la première room dispo
      const roomRef = rooms.docs[0];
      roomId = roomRef.id;
      playerNumber = 2;
      await db.collection("players").doc(deviceId).set({
        room: roomId,
        pseudo: playerNickname,
        number:2,
        x:700,
        y:450,
        score:0,
        lives:3
      });
      await db.collection("rooms").doc(roomId).update({full:true});
    }
  }

  // ======== Phaser ========
  let config = {
    type: Phaser.AUTO,
    width:800,
    height:600,
    physics:{ default:'arcade', arcade:{ gravity:{y:300}, debug:false } },
    scene:{ preload, create, update }
  };
  let game = new Phaser.Game(config);

  let player, enemy;
  let cursors;
  let stars, bombs;
  let platforms;
  let myLives = 3, enemyLives = 3;
  let gameOver = false;

  function preload(){
    this.load.image('sky','assets/sky.png');
    this.load.image('ground','assets/platform.png');
    this.load.image('star','assets/piece.png');
    this.load.image('bomb','assets/bombe.png');
    const char = localStorage.getItem('selectedCharacter')||'1';
    this.load.spritesheet('dude',`assets/personnageframe${char}.png`,{frameWidth:320, frameHeight:480});
  }

  async function create(){
    await joinRoom();

    this.add.image(400,300,'sky');
    platforms = this.physics.add.staticGroup();
    platforms.create(400,568,'ground').setScale(2).refreshBody();

    player = this.physics.add.sprite(playerNumber===1?100:700,450,'dude').setScale(0.125).setCollideWorldBounds(true).setBounce(0.2);
    enemy = this.physics.add.sprite(playerNumber===1?700:100,450,'dude').setScale(0.125).setCollideWorldBounds(true).setBounce(0.2);

    this.anims.create({key:'left',frames:this.anims.generateFrameNumbers('dude',{start:0,end:3}),frameRate:10,repeat:-1});
    this.anims.create({key:'turn',frames:[{key:'dude',frame:4}],frameRate:20});
    this.anims.create({key:'right',frames:this.anims.generateFrameNumbers('dude',{start:5,end:8}),frameRate:10,repeat:-1});

    cursors = this.input.keyboard.createCursorKeys();

    stars = this.physics.add.group();
    bombs = this.physics.add.group();

    this.physics.add.collider(player,platforms);
    this.physics.add.collider(enemy,platforms);
    this.physics.add.collider(stars,platforms);
    this.physics.add.collider(bombs,platforms);
    this.physics.add.overlap(player,stars,collectStar,null,this);
    this.physics.add.collider(player,bombs,hitBomb,null,this);

    // ======== Synchronisation ========
    db.collection("players").doc(deviceId).onSnapshot(doc=>{
      if(doc.exists){
        const data = doc.data();
        player.x = data.x; player.y = data.y; myLives = data.lives;
        updateLives();
      }
    });

    db.collection("players").where("room","==",roomId).onSnapshot(snapshot=>{
      snapshot.docs.forEach(d=>{
        if(d.id!==deviceId){
          const data = d.data();
          enemy.x = data.x; enemy.y = data.y; enemyLives = data.lives;
          updateLives();
        }
      });
    });
  }

  function update(){
    if(gameOver) return;

    let vx=0;
    if(cursors.left.isDown){ vx=-160; player.anims.play('left',true); }
    else if(cursors.right.isDown){ vx=160; player.anims.play('right',true); }
    else{ vx=0; player.anims.play('turn'); }

    if(cursors.up.isDown && player.body.touching.down){ player.setVelocityY(-330); }

    player.setVelocityX(vx);

    // Envoie la position à Firebase
    db.collection("players").doc(deviceId).update({x:player.x,y:player.y,lives:myLives});
  }

  function collectStar(playerObj, star){
    star.disableBody(true,true);
    // Si host, supprimer l'étoile dans Firebase
    // TODO: gérer host pour synchronisation complète
  }

  function hitBomb(playerObj, bomb){
    bomb.disableBody(true,true);
    myLives--;
    if(myLives<=0){ gameOver=true; alert("Vous avez perdu !"); }
    db.collection("players").doc(deviceId).update({lives:myLives});
  }

  function updateLives(){
    document.getElementById("myLives").innerHTML="";
    document.getElementById("enemyLives").innerHTML="";
    for(let i=0;i<myLives;i++){
      const img=document.createElement("img"); img.src="assets/vie1.png"; img.className="life"; document.getElementById("myLives").appendChild(img);
    }
    for(let i=0;i<enemyLives;i++){
      const img=document.createElement("img"); img.src="assets/vie1.png"; img.className="life"; document.getElementById("enemyLives").appendChild(img);
    }
  }

</script>
</body>
</html>
