<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mode Duo</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  
  <!-- Phaser -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #413d3d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas { border: 4px solid #291515; }

    .icon { cursor:pointer; width:105px; position:fixed; top:10px; }
    .icon.home { left:10px; }
    .icon.retour { left:125px; }
    .icon.refresh { right:10px; }

    /* Modal de matchmaking */
    #matchmaking-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #matchmaking-content {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      max-width: 400px;
    }
    #matchmaking-content h2 {
      margin-top: 0;
      color: #333;
    }
    #matchmaking-content p {
      color: #666;
      margin: 20px 0;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #cancel-btn {
      margin-top: 20px;
      padding: 10px 30px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    #cancel-btn:hover {
      background: #c0392b;
    }

    /* Modal de fin de partie */
    #gameover-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #gameover-content {
      background: #fff;
      padding: 50px;
      border-radius: 15px;
      text-align: center;
      max-width: 500px;
    }
    #gameover-content h2 {
      margin-top: 0;
      font-size: 36px;
    }
    .victory { color: #27ae60; }
    .defeat { color: #e74c3c; }
    #gameover-content p {
      color: #666;
      font-size: 20px;
      margin: 20px 0;
    }
    .btn-group {
      margin-top: 30px;
    }
    .btn-group button {
      margin: 0 10px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-replay {
      background: #3498db;
      color: white;
    }
    .btn-replay:hover {
      background: #2980b9;
    }
    .btn-home {
      background: #95a5a6;
      color: white;
    }
    .btn-home:hover {
      background: #7f8c8d;
    }
  </style>
</head>
<body>

  <img src="assets/logohome.png" class="icon home" onclick="window.location.href='./index.html'">
  <img src="assets/logoretour.png" class="icon retour" onclick="window.location.href='./index.html'">
  <img src="assets/logorefresh.png" class="icon refresh" onclick="location.reload()">

  <div id="game-wrapper"></div>

  <!-- Modal de matchmaking -->
  <div id="matchmaking-modal">
    <div id="matchmaking-content">
      <h2>Recherche d'un adversaire...</h2>
      <div class="spinner"></div>
      <p id="matchmaking-status">En attente d'un joueur</p>
      <button id="cancel-btn">Annuler</button>
    </div>
  </div>

  <!-- Modal de fin de partie -->
  <div id="gameover-modal">
    <div id="gameover-content">
      <h2 id="result-title"></h2>
      <p id="result-message"></p>
      <div class="btn-group">
        <button class="btn-replay" onclick="location.reload()">Rejouer</button>
        <button class="btn-home" onclick="window.location.href='./index.html'">Menu</button>
      </div>
    </div>
  </div>

<script>
  // ==== Firebase ====
  firebase.initializeApp({
    apiKey: "AIzaSyA-LI-eVf069LVpkybZh1PBvDKgE_r-WKE",
    authDomain: "bombgo-duo.firebaseapp.com",
    projectId: "bombgo-duo",
    storageBucket: "bombgo-duo.firebasestorage.app",
    messagingSenderId: "145372656449",
    appId: "1:145372656449:web:8c2df41a5911d76757a7c0"
  });
  const db = firebase.firestore();

  // ==== Device ID ====
  let deviceId = localStorage.getItem("deviceId");
  if(!deviceId){ 
    deviceId = crypto.randomUUID(); 
    localStorage.setItem("deviceId", deviceId);
  }

  let playerNickname = localStorage.getItem("playerNickname") || "Joueur";

  // ==== Variables globales ====
  var player, otherPlayer, cursors, stars, bombs, platforms;
  var myLives = 3, opponentLives = 3;
  var myLifeIcons = [], opponentLifeIcons = [];
  var gameOver = false;
  var currentLevel = 0;
  var platformsArray = [];
  var myNameText, opponentNameText;
  var myCharacter, opponentCharacter;
  
  // Variables multijoueur
  var gameId = null;
  var playerId = deviceId;
  var isPlayer1 = false;
  var gameRef = null;
  var unsubscribe = null;
  var matchmakingUnsubscribe = null;

  // ✅ OPTIMISATION: Throttle pour les mises à jour Firebase
  var lastPositionUpdate = 0;
  var UPDATE_INTERVAL = 50; // Mise à jour toutes les 50ms (20 fois/sec au lieu de 60)
  var isUpdatingFirebase = false;

  // ==== Layout des niveaux ====
  var platformLayouts = [
    [{x:600,y:400},{x:50,y:250},{x:750,y:220}],
    [{x:150,y:350},{x:400,y:200},{x:650,y:300},{x:400,y:470}],
    [{x:700,y:250},{x:80,y:150},{x:500,y:400}],
    [{x:300,y:420},{x:40,y:200},{x:650,y:120},{x:400,y:300}],
    [{x:200,y:380},{x:40,y:140},{x:600,y:240},{x:350,y:100}]
  ];

  // ==== Matchmaking simplifié (SANS INDEX) ====
  async function findMatch() {
    try {
      console.log('🔍 Démarrage du matchmaking...');
      const matchmakingRef = db.collection("matchmaking");
      const selectedChar = localStorage.getItem('selectedCharacter') || '1';
      
      // Chercher une partie en attente (requête simple, pas d'index requis)
      const snapshot = await matchmakingRef
        .where("status", "==", "waiting")
        .limit(10)
        .get();
      
      if (!snapshot.empty) {
        // Filtrer et trier côté client
        const waitingGames = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          // Vérifier que la partie n'est pas trop ancienne (5 minutes)
          const createdTime = data.created?.toDate?.() || new Date(0);
          const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000);
          
          if (createdTime > fiveMinutesAgo && data.player1 !== playerId) {
            waitingGames.push({ id: doc.id, data: data, created: createdTime });
          } else if (createdTime <= fiveMinutesAgo) {
            // Supprimer les parties trop anciennes
            doc.ref.delete().catch(() => {});
          }
        });
        
        if (waitingGames.length > 0) {
          // Trier par date de création (plus ancienne en premier)
          waitingGames.sort((a, b) => a.created - b.created);
          
          // Rejoindre la partie la plus ancienne
          const game = waitingGames[0];
          gameId = game.id;
          isPlayer1 = false;
          
          console.log('✅ Partie trouvée! Rejoindre en tant que Player 2');
          
          try {
            await matchmakingRef.doc(gameId).update({
              player2: playerId,
              player2Name: playerNickname,
              player2Character: selectedChar,
              status: "playing"
            });
            
            updateMatchmakingStatus('Adversaire trouvé ! Démarrage...');
            setTimeout(() => startGame(), 500);
            return;
          } catch (error) {
            console.error('Erreur lors de la jointure:', error);
            return findMatch();
          }
        }
      }
      
      // Pas de partie trouvée, créer une nouvelle partie
      console.log('📝 Création d\'une nouvelle partie...');
      const newGameRef = await matchmakingRef.add({
        player1: playerId,
        player1Name: playerNickname,
        player1Character: selectedChar,
        player2: null,
        player2Name: null,
        player2Character: null,
        status: "waiting",
        created: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      gameId = newGameRef.id;
      isPlayer1 = true;
      
      console.log('⏳ En attente d\'un adversaire...');
      updateMatchmakingStatus('En attente d\'un adversaire...');
      
      // Attendre qu'un joueur 2 rejoigne
      matchmakingUnsubscribe = newGameRef.onSnapshot(snapshot => {
        const data = snapshot.data();
        if (data && data.status === "playing" && data.player2) {
          console.log('✅ Adversaire trouvé!');
          updateMatchmakingStatus('Adversaire trouvé ! Démarrage...');
          if (matchmakingUnsubscribe) {
            matchmakingUnsubscribe();
            matchmakingUnsubscribe = null;
          }
          setTimeout(() => startGame(), 500);
        }
      });
      
    } catch (error) {
      console.error('❌ Erreur matchmaking:', error);
      updateMatchmakingStatus('Erreur de connexion. Nouvelle tentative...');
      setTimeout(() => findMatch(), 2000);
    }
  }

  function updateMatchmakingStatus(text) {
    const statusEl = document.getElementById('matchmaking-status');
    if (statusEl) statusEl.textContent = text;
  }

  function cancelMatchmaking() {
    console.log('❌ Annulation du matchmaking');
    
    if (matchmakingUnsubscribe) {
      matchmakingUnsubscribe();
      matchmakingUnsubscribe = null;
    }
    
    if (gameId && isPlayer1) {
      db.collection("matchmaking").doc(gameId).delete().catch(() => {});
    }
    
    window.location.href = './index.html';
  }

  document.getElementById('cancel-btn').addEventListener('click', cancelMatchmaking);

  // ==== Démarrage du jeu ====
  function startGame() {
    console.log('🎮 Démarrage du jeu...');
    document.getElementById('matchmaking-modal').style.display = 'none';
    
    gameRef = db.collection("matchmaking").doc(gameId);
    
    if (isPlayer1) {
      myCharacter = localStorage.getItem('selectedCharacter') || '1';
      gameRef.get().then(doc => {
        const data = doc.data();
        opponentCharacter = data.player2Character || '1';
        initializeGame();
      });
    } else {
      gameRef.get().then(doc => {
        const data = doc.data();
        myCharacter = data.player2Character || '1';
        opponentCharacter = data.player1Character || '1';
        initializeGame();
      });
    }
  }

  function initializeGame() {
    if (isPlayer1) {
      gameRef.set({
        player1: playerId,
        player1Name: playerNickname,
        player1Character: myCharacter,
        player1Lives: 3,
        player1X: 100,
        player1Y: 450,
        player1VelX: 0,
        player1Anim: 'turn',
        player2Character: opponentCharacter,
        player2Lives: 3,
        player2X: 700,
        player2Y: 450,
        player2VelX: 0,
        player2Anim: 'turn',
        currentLevel: 0,
        stars: Array(12).fill(true),
        bombs: [],
        gameOver: false,
        winner: null,
        status: "playing"
      }, { merge: true }).then(() => {
        console.log('✅ État du jeu initialisé');
        setupGameListener();
        launchPhaserGame();
      });
    } else {
      setupGameListener();
      launchPhaserGame();
    }
  }

  function setupGameListener() {
    unsubscribe = gameRef.onSnapshot(snapshot => {
      const data = snapshot.data();
      if (data && game && game.scene.scenes[0]) {
        updateGameState(data);
      }
    });
  }

  // ==== Phaser ====
  var game;

  function launchPhaserGame() {
    const config = {
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      parent: 'game-wrapper',
      physics: { default:'arcade', arcade:{gravity:{y:300}, debug:false} },
      scene: { preload, create, update }
    };
    game = new Phaser.Game(config);
  }

  function preload(){
    this.load.image('sky', 'assets/sky.png');
    this.load.image('ground', 'assets/platform.png');
    this.load.image('star', 'assets/star.png');
    this.load.image('bomb', 'assets/bomb.png');
    this.load.image('vie', 'assets/vie.png');
    this.load.image('novie', 'assets/novie.png');

    for(let i=1;i<=6;i++){
      this.load.spritesheet(`dude${i}`, `assets/dude${i}.png`, {frameWidth:32,frameHeight:48});
    }
  }

  function create(){
    this.add.image(400,300,'sky');

    platforms = this.physics.add.staticGroup();
    platforms.create(400,568,'ground').setScale(2).refreshBody();

    const mySkin = 'dude' + myCharacter;
    const otherSkin = 'dude' + opponentCharacter;

    const myInitX = isPlayer1 ? 100 : 700;
    const otherInitX = isPlayer1 ? 700 : 100;

    player = this.physics.add.sprite(myInitX, 450, mySkin);
    player.setBounce(0.2);
    player.setCollideWorldBounds(true);

    myNameText = this.add.text(player.x, player.y - 40, playerNickname, {
      fontSize: '16px',
      fill: '#fff',
      backgroundColor: '#000',
      padding: { x: 6, y: 4 }
    }).setOrigin(0.5, 1);

    otherPlayer = this.physics.add.sprite(otherInitX, 450, otherSkin);
    otherPlayer.setBounce(0.2);
    otherPlayer.setCollideWorldBounds(true);

    gameRef.get().then(doc => {
      const data = doc.data();
      const opponentName = isPlayer1 ? (data.player2Name || 'Adversaire') : (data.player1Name || 'Adversaire');
      
      opponentNameText = this.add.text(otherPlayer.x, otherPlayer.y - 40, opponentName, {
        fontSize: '16px',
        fill: '#fff',
        backgroundColor: '#000',
        padding: { x: 6, y: 4 }
      }).setOrigin(0.5, 1);
    });

    for(let i=0; i<3; i++){
      myLifeIcons.push(this.add.image(30+i*40, 30, 'vie').setScale(0.015));
      opponentLifeIcons.push(this.add.image(770-i*40, 30, 'vie').setScale(0.015));
    }

    createPlatformsForLevel(0);

    [
      {skin:mySkin, prefix:''},
      {skin:otherSkin, prefix:'other-'}
    ].forEach(({skin, prefix}) => {
      this.anims.create({
        key: prefix+'left',
        frames: this.anims.generateFrameNumbers(skin, {start:0, end:3}),
        frameRate: 10,
        repeat: -1
      });
      this.anims.create({
        key: prefix+'turn',
        frames: [{key:skin, frame:4}],
        frameRate: 20
      });
      this.anims.create({
        key: prefix+'right',
        frames: this.anims.generateFrameNumbers(skin, {start:5, end:8}),
        frameRate: 10,
        repeat: -1
      });
    });

    cursors = this.input.keyboard.createCursorKeys();

    // ✅ OPTIMISATION: Créer les étoiles une seule fois
    stars = this.physics.add.group({
      key:'star', 
      repeat:11, 
      setXY:{x:12, y:0, stepX:70}
    });
    
    stars.children.iterate(c => { 
      c.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8)); 
      c.setScale(0.015);
      c.body.setGravityY(200); // Gravité définie UNE SEULE FOIS
    });

    bombs = this.physics.add.group();

    this.physics.add.collider(player, platforms);
    this.physics.add.collider(otherPlayer, platforms);
    this.physics.add.collider(stars, platforms);
    this.physics.add.collider(bombs, platforms);
    this.physics.add.overlap(player, stars, collectStar, null, this);
    this.physics.add.collider(player, bombs, hitBomb, null, this);
    this.physics.add.collider(otherPlayer, bombs, () => {}, null, this);
  }

  function update(){
    if(gameOver) return;
    
    let currentAnim = 'turn';
    
    if(cursors.left.isDown){ 
      player.setVelocityX(-160); 
      player.anims.play('left',true);
      currentAnim = 'left';
    }
    else if(cursors.right.isDown){ 
      player.setVelocityX(160); 
      player.anims.play('right',true);
      currentAnim = 'right';
    }
    else { 
      player.setVelocityX(0); 
      player.anims.play('turn'); 
      currentAnim = 'turn';
    }
    
    if(cursors.up.isDown && player.body.touching.down) {
      player.setVelocityY(-330);
    }

    if (myNameText && player) {
      myNameText.setPosition(player.x, player.y - 40);
    }
    
    if (opponentNameText && otherPlayer) {
      opponentNameText.setPosition(otherPlayer.x, otherPlayer.y - 40);
    }

    // ✅ OPTIMISATION: Throttle des mises à jour Firebase
    const now = Date.now();
    if (gameRef && player && now - lastPositionUpdate > UPDATE_INTERVAL && !isUpdatingFirebase) {
      lastPositionUpdate = now;
      isUpdatingFirebase = true;
      
      const playerKey = isPlayer1 ? 'player1' : 'player2';
      gameRef.update({
        [`${playerKey}X`]: Math.round(player.x),
        [`${playerKey}Y`]: Math.round(player.y),
        [`${playerKey}VelX`]: Math.round(player.body.velocity.x),
        [`${playerKey}Anim`]: currentAnim
      }).then(() => {
        isUpdatingFirebase = false;
      }).catch(() => {
        isUpdatingFirebase = false;
      });
    }
  }

  function collectStar(player, star){
    const starIndex = stars.children.entries.indexOf(star);
    star.disableBody(true,true);
    
    gameRef.get().then(doc => {
      const data = doc.data();
      const newStars = [...data.stars];
      newStars[starIndex] = false;
      
      const activeStars = newStars.filter(s => s).length;
      
      if(activeStars === 0) {
        const newLevel = (data.currentLevel + 1) % platformLayouts.length;
        
        const x = (player.x < 400) ? Phaser.Math.Between(400, 800) : Phaser.Math.Between(0, 400);
        const newBombs = [...data.bombs, {x, y: 16, vx: Phaser.Math.Between(-200, 200)}];
        
        gameRef.update({
          stars: Array(12).fill(true),
          currentLevel: newLevel,
          bombs: newBombs
        });
      } else {
        gameRef.update({ stars: newStars });
      }
    }).catch(error => {
      console.error('Erreur collectStar:', error);
    });
  }

  function hitBomb(player, bomb){
    const playerKey = isPlayer1 ? 'player1Lives' : 'player2Lives';
    
    gameRef.get().then(doc => {
      const data = doc.data();
      const newLives = data[playerKey] - 1;
      
      const update = {};
      update[playerKey] = newLives;
      
      if (newLives <= 0) {
        update.gameOver = true;
        update.winner = isPlayer1 ? 'player2' : 'player1';
      }
      
      gameRef.update(update);
    }).catch(error => {
      console.error('Erreur hitBomb:', error);
    });
    
    bomb.disableBody(true, true);
  }

  // ✅ OPTIMISATION: Éviter les boucles infinies
  var lastGameState = {};
  
  function updateGameState(data) {
    // Mettre à jour les vies
    updateLives(data.player1Lives, data.player2Lives);
    
    // ✅ OPTIMISATION: Mise à jour de la position de l'adversaire (interpolation simple)
    if (otherPlayer) {
      const otherX = isPlayer1 ? data.player2X : data.player1X;
      const otherY = isPlayer1 ? data.player2Y : data.player1Y;
      const otherAnim = isPlayer1 ? data.player2Anim : data.player1Anim;
      
      if (otherX !== undefined && otherY !== undefined) {
        // Interpolation douce pour éviter les téléportations
        const distance = Phaser.Math.Distance.Between(otherPlayer.x, otherPlayer.y, otherX, otherY);
        
        if (distance > 5) { // Seulement si le mouvement est significatif
          otherPlayer.setPosition(otherX, otherY);
        }
        
        if (otherAnim === 'left') {
          otherPlayer.anims.play('other-left', true);
        } else if (otherAnim === 'right') {
          otherPlayer.anims.play('other-right', true);
        } else {
          otherPlayer.anims.play('other-turn', true);
        }
      }
    }
    
    // ✅ OPTIMISATION: Mise à jour de la position de l'adversaire (interpolation simple)
    if (otherPlayer) {
      const otherX = isPlayer1 ? data.player2X : data.player1X;
      const otherY = isPlayer1 ? data.player2Y : data.player1Y;
      const otherAnim = isPlayer1 ? data.player2Anim : data.player1Anim;
      
      if (otherX !== undefined && otherY !== undefined) {
        // Interpolation douce pour éviter les téléportations
        const distance = Phaser.Math.Distance.Between(otherPlayer.x, otherPlayer.y, otherX, otherY);
        
        if (distance > 5) { // Seulement si le mouvement est significatif
          otherPlayer.setPosition(otherX, otherY);
        }
        
        if (otherAnim === 'left') {
          otherPlayer.anims.play('other-left', true);
        } else if (otherAnim === 'right') {
          otherPlayer.anims.play('other-right', true);
        } else {
          otherPlayer.anims.play('other-turn', true);
        }
      }
    }
    
    // ✅ OPTIMISATION: Mise à jour des étoiles seulement si changement
    if (stars && data.stars && JSON.stringify(data.stars) !== JSON.stringify(lastGameState.stars)) {
      stars.children.entries.forEach((star, i) => {
        if (data.stars[i] && !star.active) {
          star.enableBody(true, 12 + i * 70, 0, true, true);
          // La gravité est déjà définie, pas besoin de la réappliquer
        } else if (!data.stars[i] && star.active) {
          star.disableBody(true, true);
        }
      });
      lastGameState.stars = [...data.stars];
    }
    
    // ✅ OPTIMISATION: Mise à jour des bombes seulement si changement
    if (bombs && data.bombs && JSON.stringify(data.bombs) !== JSON.stringify(lastGameState.bombs)) {
      // Créer un Map des bombes actuelles par position
      const currentBombs = new Map();
      bombs.children.entries.forEach(bomb => {
        const key = `${Math.round(bomb.x)}_${Math.round(bomb.y)}`;
        currentBombs.set(key, bomb);
      });
      
      // Ajouter les nouvelles bombes
      data.bombs.forEach(b => {
        const key = `${Math.round(b.x)}_${Math.round(b.y)}`;
        if (!currentBombs.has(key)) {
          const bomb = bombs.create(b.x, b.y, 'bomb');
          bomb.setScale(0.015);
          bomb.setBounce(1);
          bomb.setCollideWorldBounds(true);
          bomb.setVelocity(b.vx, 20);
        }
      });
      
      lastGameState.bombs = JSON.parse(JSON.stringify(data.bombs));
    }
    
    // Mettre à jour le niveau
    if (data.currentLevel !== currentLevel) {
      currentLevel = data.currentLevel;
      createPlatformsForLevel(currentLevel);
    }
    
    if (data.gameOver && !gameOver) {
      gameOver = true;
      endGame(data.winner);
    }
  }

  function updateLives(p1Lives, p2Lives) {
    const myLivesCount = isPlayer1 ? p1Lives : p2Lives;
    const opponentLivesCount = isPlayer1 ? p2Lives : p1Lives;
    
    for (let i = 0; i < 3; i++) {
      if (i < myLivesCount) {
        myLifeIcons[i].setTexture('vie');
      } else {
        myLifeIcons[i].setTexture('novie');
      }
    }
    
    for (let i = 0; i < 3; i++) {
      if (i < opponentLivesCount) {
        opponentLifeIcons[i].setTexture('vie');
      } else {
        opponentLifeIcons[i].setTexture('novie');
      }
    }
    
    myLives = myLivesCount;
    opponentLives = opponentLivesCount;
  }

  function endGame(winner) {
    if (game && game.scene.scenes[0]) {
      game.scene.scenes[0].physics.pause();
    }
    
    const modal = document.getElementById("gameover-modal");
    const title = document.getElementById("result-title");
    const message = document.getElementById("result-message");
    
    const iWon = (isPlayer1 && winner === 'player1') || (!isPlayer1 && winner === 'player2');
    
    if (iWon) {
      title.textContent = "🎉 VICTOIRE ! 🎉";
      title.className = "victory";
      message.textContent = "Vous avez vaincu votre adversaire !";
    } else {
      title.textContent = "💀 DÉFAITE 💀";
      title.className = "defeat";
      message.textContent = "Votre adversaire a gagné...";
    }
    
    modal.style.display = "flex";
    
    if (unsubscribe) {
      unsubscribe();
      unsubscribe = null;
    }
    
    if (matchmakingUnsubscribe) {
      matchmakingUnsubscribe();
      matchmakingUnsubscribe = null;
    }
  }

  function createPlatformsForLevel(level){
    platformsArray.forEach(p=>p.destroy());
    platformsArray=[];
    platformLayouts[level].forEach(pos=>platformsArray.push(platforms.create(pos.x,pos.y,'ground')));
  }

  window.addEventListener('beforeunload', () => {
    if (unsubscribe) {
      unsubscribe();
      unsubscribe = null;
    }
    
    if (matchmakingUnsubscribe) {
      matchmakingUnsubscribe();
      matchmakingUnsubscribe = null;
    }
    
    if (gameId && isPlayer1) {
      db.collection("matchmaking").doc(gameId).delete().catch(() => {});
    }
  });

  // Démarrer le matchmaking
  findMatch();

</script>
</body>
</html>
