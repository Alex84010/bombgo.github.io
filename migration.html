<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Migration Scores → Users</title>
<link rel="icon" href="./favicon.png">
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body {
  margin: 0;
  background: #333;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 40px;
}
button {
  padding: 15px 30px;
  font-size: 20px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #4CAF50;
  color: white;
  margin: 10px;
}
button:hover {
  background: #45a049;
}
button.danger {
  background: #f44336;
}
button.danger:hover {
  background: #da190b;
}
#log {
  background: #222;
  margin: 20px auto;
  padding: 20px;
  max-width: 900px;
  text-align: left;
  font-family: monospace;
  font-size: 14px;
  border: 1px solid #555;
  max-height: 500px;
  overflow-y: auto;
}
.success { color: #4CAF50; }
.error { color: #f44336; }
.info { color: #2196F3; }
.warning { color: #ff9800; }
</style>
</head>
<body>
<h1>🔄 Migration Scores → Users</h1>
<p>Cet outil migre les anciennes données de la collection "scores" vers "users"</p>

<button onclick="previewMigration()">👁️ Prévisualiser la migration</button>
<button onclick="executeMigration()" class="danger">⚠️ MIGRER LES DONNÉES</button>
<button onclick="clearLog()">🧹 Effacer le log</button>

<div id="log"></div>

<script>
// 🔥 CONFIG
firebase.initializeApp({
  apiKey: "AIzaSyBnQb5b5h62Jl4WeiKEBMeEmivbOK-B70k",
  authDomain: "bombgo-classement.firebaseapp.com",
  projectId: "bombgo-classement",
  appId: "1:113313571513:web:73863b02df8193606ef168"
});
const db = firebase.firestore();

// Logger
function log(msg, type = 'info') {
  console.log(msg);
  const logDiv = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  logDiv.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
  logDiv.scrollTop = logDiv.scrollHeight;
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
}

// Prévisualisation
async function previewMigration() {
  log('=== PRÉVISUALISATION ===', 'info');
  
  try {
    const scoresSnap = await db.collection("scores").get();
    log(`📊 ${scoresSnap.size} documents trouvés dans "scores"`, 'info');
    
    scoresSnap.forEach(doc => {
      const data = doc.data();
      log(`  • ID: ${doc.id}`, 'info');
      log(`    - pseudo: ${data.pseudo || 'N/A'}`, 'info');
      log(`    - score: ${data.score || 0}`, 'info');
      log(`    - date: ${data.date ? new Date(data.date).toLocaleString() : 'N/A'}`, 'info');
    });
    
    log('', 'info');
    log('⚠️ Ces données seront copiées dans "users" avec les champs:', 'warning');
    log('  - pseudo (conservé)', 'warning');
    log('  - maxScore (= score)', 'warning');
    log('  - skin (= 1 par défaut)', 'warning');
    log('  - niveauxDebloques (= 0 par défaut)', 'warning');
    
  } catch(error) {
    log('❌ Erreur: ' + error.message, 'error');
  }
}

// Migration
async function executeMigration() {
  if(!confirm('⚠️ ATTENTION! Cette opération va créer/mettre à jour les documents dans "users".\n\nVoulez-vous continuer ?')) {
    return;
  }
  
  log('=== DÉBUT DE LA MIGRATION ===', 'warning');
  
  try {
    const scoresSnap = await db.collection("scores").get();
    log(`📊 ${scoresSnap.size} documents à migrer`, 'info');
    
    let successCount = 0;
    let errorCount = 0;
    
    for (const doc of scoresSnap.docs) {
      const deviceId = doc.id;
      const oldData = doc.data();
      
      log(``, 'info');
      log(`🔄 Migration de ${deviceId}...`, 'info');
      
      try {
        // Vérifier si le document existe déjà dans users
        const userDoc = await db.collection("users").doc(deviceId).get();
        
        if (userDoc.exists) {
          const userData = userDoc.data();
          log(`  ℹ️ Document existe déjà`, 'warning');
          
          // Mettre à jour uniquement si le score est meilleur
          if ((oldData.score || 0) > (userData.maxScore || 0)) {
            await db.collection("users").doc(deviceId).update({
              pseudo: oldData.pseudo || userData.pseudo || 'player',
              maxScore: oldData.score || 0
            });
            log(`  ✅ Score mis à jour: ${userData.maxScore || 0} → ${oldData.score || 0}`, 'success');
            successCount++;
          } else {
            log(`  ⏭️ Score existant meilleur: ${userData.maxScore || 0} ≥ ${oldData.score || 0}`, 'info');
          }
        } else {
          // Créer un nouveau document
          await db.collection("users").doc(deviceId).set({
            pseudo: oldData.pseudo || 'player',
            maxScore: oldData.score || 0,
            skin: 1,
            niveauxDebloques: 0
          });
          log(`  ✅ Nouveau document créé`, 'success');
          log(`    - pseudo: ${oldData.pseudo || 'player'}`, 'success');
          log(`    - maxScore: ${oldData.score || 0}`, 'success');
          successCount++;
        }
        
      } catch(error) {
        log(`  ❌ Erreur: ${error.message}`, 'error');
        errorCount++;
      }
    }
    
    log('', 'info');
    log('=== MIGRATION TERMINÉE ===', 'success');
    log(`✅ Réussis: ${successCount}`, 'success');
    log(`❌ Erreurs: ${errorCount}`, errorCount > 0 ? 'error' : 'success');
    
    if (errorCount === 0) {
      log('', 'info');
      log('🎉 Migration réussie! Vous pouvez maintenant retourner au panel admin.', 'success');
    }
    
  } catch(error) {
    log('❌ Erreur fatale: ' + error.message, 'error');
  }
}

log('🚀 Outil de migration chargé', 'info');
log('👉 Cliquez sur "Prévisualiser" pour voir les données avant de migrer', 'info');
</script>
</body>
</html>
