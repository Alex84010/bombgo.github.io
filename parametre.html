<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Parametre</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      background: #333;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .title {
      font-size: 48px;
      margin-top: 80px;
      margin-bottom: 40px;
    }

    .nickname-section {
      margin: 30px auto;
      max-width: 500px;
    }

    .nickname-section h2 {
      font-size: 28px;
      margin-bottom: 15px;
      color: #FFD700;
    }

    .nickname-input {
      background: #444;
      border: 3px solid #666;
      border-radius: 10px;
      padding: 15px 20px;
      font-size: 20px;
      color: white;
      width: 300px;
      text-align: center;
      transition: border-color 0.3s;
    }

    .nickname-input:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .character-selection {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 30px;
      margin: 40px auto;
      max-width: 900px;
    }

    .character-section-title {
      font-size: 28px;
      margin: 40px 0 20px 0;
      color: #FFD700;
    }

    .character-option {
      background: #444;
      border: 4px solid #666;
      border-radius: 15px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s;
      width: 150px
    }

    .character-option.hover {
      transform: scale(1.05);
      border-color: #4CAF50;
    }

    .character-option.selected {
      border-color: #FFD700;
      background: #555;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .character-option img {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    .character-option p {
      margin: 10px 0 0 0;
      font-size: 18px;
    }

    .save-button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 24px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.3s;
    }

    .save-button:hover {
      background: #45a049;
    }

  </style>
</head>

<body>

  <img src="assets/logohome.png" style="width:105px; position:fixed; top:10px; left:10px;"
    onclick="window.location.href='./index.html'">
  <img src="assets/logoretour.png" style="width:105px; position:fixed; top:10px; left:125px;"
    onclick="window.location.href='./index.html'">
  <img src="assets/logorefresh.png" style="width:105px; position:fixed; top:10px; right:10px;"
    onclick="window.location.href='./parametre.html'">

  <h1 class="title">PARAMETRE</h1>

  <div class="nickname-section">
    <input type="text" id="nicknameInput" class="nickname-input" placeholder="Entrez votre pseudo" maxlength="20">
  </div>

  <div class="character-selection" id="CharacterSelection">

  </div>

  <button class="save-button" onclick="saveAndReturn()">Valider</button>

  <script>
    // Firebase init
    firebase.initializeApp({
      apiKey: "AIzaSyBnQb5b5h62Jl4WeiKEBMeEmivbOK-B70k",
      authDomain: "bombgo-classement.firebaseapp.com",
      projectId: "bombgo-classement",
      appId: "1:113313571513:web:73863b02df8193606ef168"
    });
    const db = firebase.firestore();

    // Device ID
    let deviceId = localStorage.getItem("deviceId");
    if(!deviceId){ 
      deviceId = crypto.randomUUID(); 
      localStorage.setItem("deviceId", deviceId); 
    }

    const numberOfCharacter = 4;
    let selectedCharacter = 1;
    let playerNickname = 'player';

    // Charger le pseudo sauvegardé
    const savedNickname = localStorage.getItem('playerNickname');
    if (savedNickname) {
      playerNickname = savedNickname;
    }

    // Afficher le pseudo dans l'input
    document.getElementById('nicknameInput').value = playerNickname;

    // Charger le personnage sauvegardé
    const savedCharacter = localStorage.getItem('selectedCharacter');
    if (savedCharacter) {
      selectedCharacter = parseInt(savedCharacter);
    }

    const container = document.getElementById('CharacterSelection');

    for (let i = 1; i <= numberOfCharacter; i++) {
      const option = document.createElement('div');
      option.className = 'character-option';

      if (i === selectedCharacter) {
        option.classList.add('selected');
      }

      option.innerHTML = `
        <img src="assets/personnage${i}.png" alt="Personnage ${i}">
        <p>Personnage ${i}</p>
      `;

      option.onclick = () => selectCharacter(i);
      container.appendChild(option);
    }

    function selectCharacter(num) {
      selectedCharacter = num;

      document.querySelectorAll('.character-option').forEach((opt, index) => {
        opt.classList.toggle('selected', index + 1 === num);
      });
    }

    // Fonction pour synchroniser avec Firebase
    async function syncToFirebase(nickname, skin) {
      try {
        const userRef = db.collection("users").doc(deviceId);
        const doc = await userRef.get();
        
        const updates = {
          pseudo: nickname,
          skin: skin
        };
        
        if (!doc.exists) {
          // Nouveau joueur : créer avec valeurs par défaut
          await userRef.set({
            ...updates,
            maxScore: 0,
            niveauxDebloques: 0
          });
          console.log("✅ Nouveau joueur créé");
        } else {
          // Joueur existant : mettre à jour uniquement pseudo et skin
          await userRef.update(updates);
          console.log("✅ Paramètres mis à jour");
        }
      } catch(err) {
        console.error("❌ Erreur Firebase:", err);
      }
    }

    function saveAndReturn() {
      // Récupérer le pseudo de l'input
      const nicknameValue = document.getElementById('nicknameInput').value.trim();
      
      // Si le pseudo est vide, utiliser "player" par défaut
      const finalNickname = nicknameValue === '' ? 'player' : nicknameValue;
      
      // Sauvegarder le pseudo et le personnage dans localStorage
      localStorage.setItem('playerNickname', finalNickname);
      localStorage.setItem('selectedCharacter', selectedCharacter);
      
      // Synchroniser avec Firebase
      syncToFirebase(finalNickname, selectedCharacter);
      
      // Retourner à l'accueil après un court délai
      setTimeout(() => {
        window.location.href = './index.html';
      }, 300);
    }

    // Permettre de valider en appuyant sur Entrée dans l'input
    document.getElementById('nicknameInput').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        saveAndReturn();
      }
    });
  </script>

</body>
</html>
