<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Solo - BombGo</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  
  <!-- Phaser -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #413d3d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas { border: 4px solid #291515; }

    /* Les icônes en haut */
    .icon { cursor:pointer; width:105px; position:fixed; top:10px; }
    .icon.home { left:10px; }
    .icon.retour { left:125px; }
    .icon.refresh { right:10px; }
  </style>
</head>
<body>

  <img src="assets/logohome.png" class="icon home" onclick="window.location.href='./index.html'">
  <img src="assets/logoretour.png" class="icon retour" onclick="window.location.href='./index.html'">
  <img src="assets/logorefresh.png" class="icon refresh" onclick="window.location.href='./solo.html'">

  <div id="game-wrapper"></div>

<script>
  // ========================================
  // FIREBASE CONFIGURATION
  // ========================================
  firebase.initializeApp({
    apiKey: "AIzaSyBnQb5b5h62Jl4WeiKEBMeEmivbOK-B70k",
    authDomain: "bombgo-classement.firebaseapp.com",
    projectId: "bombgo-classement",
    appId: "1:113313571513:web:73863b02df8193606ef168"
  });
  const db = firebase.firestore();

  // ========================================
  // USER DATA
  // ========================================
  let deviceId = localStorage.getItem("deviceId");
  if(!deviceId){ 
    deviceId = crypto.randomUUID(); 
    localStorage.setItem("deviceId", deviceId); 
  }

  let playerNickname = localStorage.getItem("playerNickname") || "player";
  let selectedSkin = parseInt(localStorage.getItem('selectedCharacter') || '1');

  console.log("🎮 Device ID:", deviceId);
  console.log("👤 Pseudo:", playerNickname);
  console.log("🎨 Skin:", selectedSkin);

  // ========================================
  // SYNCHRONISATION FIREBASE
  // ========================================
  let maxScoreEverReached = 0; // Score max atteint dans cette session
  let maxLevelEverReached = 0; // Niveau max atteint dans cette session

  // Fonction pour synchroniser les données
  async function syncToFirebase() {
    try {
      const userRef = db.collection("users").doc(deviceId);
      const doc = await userRef.get();
      
      if (doc.exists) {
        // Utilisateur existe : récupérer son meilleur score
        const data = doc.data();
        maxScoreEverReached = Math.max(maxScoreEverReached, data.maxScore || 0);
        maxLevelEverReached = Math.max(maxLevelEverReached, data.niveauxDebloques || 0);
      }
      
      // Mettre à jour avec les données actuelles
      await userRef.set({
        pseudo: playerNickname,
        maxScore: maxScoreEverReached,
        skin: selectedSkin,
        niveauxDebloques: maxLevelEverReached
      }, { merge: true });
      
      console.log("✅ Sync Firebase OK - Score:", maxScoreEverReached, "Niveau:", maxLevelEverReached);
    } catch(err) {
      console.error("❌ Erreur Firebase:", err);
    }
  }

  // Sauvegarder quand on quitte la page
  window.addEventListener('beforeunload', () => {
    syncToFirebase();
  });

  // Synchroniser au chargement
  syncToFirebase();

  // ========================================
  // PHASER GAME VARIABLES
  // ========================================
  var player, cursors, stars, bombs, platforms;
  var score = 0, scoreText;
  var lives = 3, lifeIcons = [];
  var gameOver = false;
  var currentLevel = 0;
  var platformsArray = [];

  // Layout des niveaux
  var platformLayouts = [
    [{x:600,y:400},{x:50,y:250},{x:750,y:220}],
    [{x:150,y:350},{x:400,y:200},{x:650,y:300},{x:400,y:470}],
    [{x:700,y:250},{x:80,y:150},{x:500,y:400}],
    [{x:300,y:420},{x:40,y:200},{x:650,y:120},{x:400,y:300}],
    [{x:200,y:380},{x:40,y:140},{x:600,y:240},{x:350,y:100}],
    [{x:200,y:150},{x:500,y:310},{x:700,y:180},{x:350,y:460}],
    [{x:100,y:380},{x:300,y:250},{x:500,y:150},{x:700,y:250}],
    [{x:50,y:380},{x:250,y:200},{x:450,y:100},{x:650,y:200}],
    [{x:400,y:380},{x:200,y:250},{x:600,y:150}],
    [{x:100,y:500},{x:300,y:350},{x:500,y:200},{x:700,y:100}]
  ];

  // ========================================
  // PHASER CONFIG
  // ========================================
  var config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: { 
      default: 'arcade', 
      arcade: { gravity:{y:300}, debug:false } 
    },
    scene: { preload, create, update }
  };
  new Phaser.Game(config);

  // ========================================
  // PHASER PRELOAD
  // ========================================
  function preload(){
    this.load.image('sky','assets/sky.png');
    this.load.image('ground','assets/platform.png');
    this.load.image('star','assets/piece.png');
    this.load.image('bomb','assets/bombe.png');
    this.load.image('vie','assets/vie1.png');
    this.load.image('novie','assets/vie2.png');
    this.load.spritesheet('dude',`assets/personnageframe${selectedSkin}.png`,{frameWidth:320, frameHeight:480});
  }

  // ========================================
  // PHASER CREATE
  // ========================================
  function create(){
    this.add.image(400,300,'sky');
    scoreText = this.add.text(16,16,'Score: 0',{fontSize:'32px',fill:'#000'});

    // Icônes de vie
    for(let i=0;i<lives;i++) {
      lifeIcons.push(this.add.image(40+i*45,70,'vie').setScale(0.02));
    }

    // Plateformes
    platforms = this.physics.add.staticGroup();
    platforms.create(400,568,'ground').setScale(2).refreshBody();
    createPlatformsForLevel(currentLevel);

    // Joueur
    player = this.physics.add.sprite(100,450,'dude')
      .setScale(0.125)
      .setBounce(0.2)
      .setCollideWorldBounds(true);
    
    // Animations
    this.anims.create({
      key:'left', 
      frames:this.anims.generateFrameNumbers('dude',{start:0,end:3}), 
      frameRate:10, 
      repeat:-1
    });
    this.anims.create({
      key:'turn', 
      frames:[{key:'dude',frame:4}], 
      frameRate:20
    });
    this.anims.create({
      key:'right', 
      frames:this.anims.generateFrameNumbers('dude',{start:5,end:8}), 
      frameRate:10, 
      repeat:-1
    });

    cursors = this.input.keyboard.createCursorKeys();

    // Étoiles
    stars = this.physics.add.group({
      key:'star', 
      repeat:11, 
      setXY:{x:12,y:0,stepX:70}
    });
    stars.children.iterate(c => { 
      c.setBounceY(Phaser.Math.FloatBetween(0.4,0.8)); 
      c.setScale(0.015); 
    });

    // Bombes
    bombs = this.physics.add.group();

    // Collisions
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(stars, platforms);
    this.physics.add.collider(bombs, platforms);
    this.physics.add.overlap(player, stars, collectStar, null, this);
    this.physics.add.collider(player, bombs, hitBomb, null, this);
  }

  // ========================================
  // PHASER UPDATE
  // ========================================
  function update(){
    if(gameOver) return;
    
    if(cursors.left.isDown){ 
      player.setVelocityX(-160); 
      player.anims.play('left',true);
    }
    else if(cursors.right.isDown){ 
      player.setVelocityX(160); 
      player.anims.play('right',true);
    }
    else { 
      player.setVelocityX(0); 
      player.anims.play('turn'); 
    }
    
    if(cursors.up.isDown && player.body.touching.down) {
      player.setVelocityY(-330);
    }
  }

  // ========================================
  // COLLECT STAR
  // ========================================
  function collectStar(player, star){
    star.disableBody(true,true);
    score += 10;
    scoreText.setText('Score: '+score);
    
    // Mettre à jour le max score si nécessaire
    if(score > maxScoreEverReached) {
      maxScoreEverReached = score;
      console.log("🏆 Nouveau record:", maxScoreEverReached);
    }
    
    // Toutes les étoiles collectées = nouveau niveau
    if(stars.countActive(true)===0){
      changeLevel();
      
      // Réapparaître les étoiles
      stars.children.iterate(c => c.enableBody(true,c.x,0,true,true));
      
      // Créer une bombe
      let x = (player.x<400) ? Phaser.Math.Between(400,800) : Phaser.Math.Between(0,400);
      let bomb = bombs.create(x,16,'bomb').setScale(0.015);
      bomb.body.setSize(bomb.width*0.015, bomb.height*0.015);
      bomb.body.setOffset(bomb.width*0.015, bomb.height*0.015);
      bomb.setBounce(1).setCollideWorldBounds(true).setVelocity(Phaser.Math.Between(-200,200),20);
    }
  }

  // ========================================
  // HIT BOMB
  // ========================================
  function hitBomb(player, bomb){
    bomb.disableBody(true,true);
    lives--;
    
    if(lives>=0) {
      lifeIcons[lives].setTexture('novie').setScale(0.02);
    }
    
    if(lives<=0 && !gameOver){
      gameOver=true;
      this.physics.pause();
      player.setTint(0xff0000); 
      player.anims.play('turn');
      
      console.log("💀 Game Over - Score final:", score);
      
      // Synchroniser le score final
      syncToFirebase();
    }
  }

  // ========================================
  // CREATE PLATFORMS
  // ========================================
  function createPlatformsForLevel(level){
    platformsArray.forEach(p=>p.destroy());
    platformsArray=[];
    platformLayouts[level].forEach(pos => {
      platformsArray.push(platforms.create(pos.x,pos.y,'ground'));
    });
  }

  // ========================================
  // CHANGE LEVEL
  // ========================================
  function changeLevel(){
    currentLevel = (currentLevel+1) % platformLayouts.length;
    createPlatformsForLevel(currentLevel);
    
    // Mettre à jour le niveau max
    if(currentLevel + 1 > maxLevelEverReached) {
      maxLevelEverReached = currentLevel + 1;
      console.log("🎯 Nouveau niveau débloqué:", maxLevelEverReached);
      
      // Synchroniser immédiatement le nouveau niveau
      syncToFirebase();
    }
  }

</script>
</body>
</html>
