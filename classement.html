<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Classement</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">
  <style>
    body {
      margin: 0;
      background: #2e2e2e;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 { margin-top: 20px; }

    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 80%;
      max-width: 700px;
      background: #1f1f1f;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #444;
    }

    th { background: #111; font-size: 18px; }

    tr.me { color: gold; font-weight: bold; }

    tr:nth-child(even) { background: #262626; }

    .back {
      position: fixed;
      top: 10px;
      left: 10px;
      cursor: pointer;
      width: 100px;
    }
  </style>
</head>
<body>

  <img src="assets/logoretour.png" class="back" onclick="location.href='index.html'">
  <h1>🏆 Classement</h1>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Pseudo</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="ranking"></tbody>
  </table>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Initialisation Firebase
    firebase.initializeApp({
      apiKey: "AIzaSyBnQb5b5h62Jl4WeiKEBMeEmivbOK-B70k",
      authDomain: "bombgo-classement.firebaseapp.com",
      projectId: "bombgo-classement",
      appId: "1:113313571513:web:73863b02df8193606ef168"
    });

    const db = firebase.firestore();

    // Récupérer deviceId pour surligner le joueur actuel
    const deviceId = localStorage.getItem("deviceId");
    const ranking = document.getElementById("ranking");

    // 🔄 Classement en temps réel
    db.collection("scores").orderBy("score", "desc").onSnapshot(snapshot => {

      // Vider le tableau
      ranking.innerHTML = "";

      let index = 1;
      snapshot.forEach(doc => {
        const data = doc.data();
        const tr = document.createElement("tr");

        if (doc.id === deviceId) tr.classList.add("me"); // ton score en jaune

        tr.innerHTML = `<td>${index}</td><td>${data.pseudo}</td><td>${data.score}</td>`;
        ranking.appendChild(tr);

        index++;
      });

    });
  </script>
</body>
</html>
