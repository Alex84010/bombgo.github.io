<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<link rel="icon" href="./favicon.png">
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body {
  margin: 0;
  background: #333;
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 {
  margin-top: 60px;
}
input {
  padding: 10px;
  font-size: 18px;
  margin: 5px;
  border-radius: 6px;
  border: none;
}
button {
  padding: 10px 20px;
  font-size: 18px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #4CAF50;
  color: white;
}
button:hover {
  background: #45a049;
}
table {
  margin: 40px auto;
  border-collapse: collapse;
  width: 90%;
}
th, td {
  border: 1px solid #666;
  padding: 8px;
}
.hidden {
  display: none;
}
#debug {
  background: #222;
  margin: 20px auto;
  padding: 10px;
  max-width: 800px;
  text-align: left;
  font-family: monospace;
  font-size: 12px;
  border: 1px solid #555;
}
</style>
</head>
<body>
<h1>PANEL ADMIN</h1>

<!-- DEBUG INFO -->
<div id="debug"></div>

<!-- LOGIN -->
<div id="loginBox">
  <input id="email" type="email" placeholder="email admin"><br>
  <input id="password" type="password" placeholder="mot de passe"><br>
  <button onclick="login()">Connexion</button>
</div>
<!-- ADMIN -->
<div id="adminBox" class="hidden">
  <button onclick="logout()">Déconnexion</button>
  <table>
    <thead>
      <tr>
        <th>UID</th>
        <th>Pseudo</th>
        <th>Score</th>
        <th>Skin</th>
        <th>Niveaux</th>
        <th>💾</th>
      </tr>
    </thead>
    <tbody id="userList"></tbody>
  </table>
</div>
<script>
// 🔥 CONFIG (LA TIENNE)
firebase.initializeApp({
  apiKey: "AIzaSyBnQb5b5h62Jl4WeiKEBMeEmivbOK-B70k",
  authDomain: "bombgo-classement.firebaseapp.com",
  projectId: "bombgo-classement",
  appId: "1:113313571513:web:73863b02df8193606ef168"
});
const auth = firebase.auth();
const db = firebase.firestore();

// Debug helper
function log(msg) {
  console.log(msg);
  const debugDiv = document.getElementById('debug');
  debugDiv.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
}

// 🔐 LOGIN
function login(){
  log("Tentative de connexion...");
  auth.signInWithEmailAndPassword(
    email.value,
    password.value
  )
  .then((userCredential) => {
    log("✅ Authentification réussie pour: " + userCredential.user.email);
    log("UID: " + userCredential.user.uid);
  })
  .catch(e => {
    log("❌ Erreur authentification: " + e.message);
    alert("Erreur : " + e.message);
  });
}

// 🔓 LOGOUT
function logout(){
  log("Déconnexion...");
  auth.signOut();
}

// 👮 CHECK ADMIN
auth.onAuthStateChanged(async user => {
  log("=== onAuthStateChanged déclenché ===");
  
  if(!user){
    log("❌ Aucun utilisateur connecté");
    loginBox.classList.remove("hidden");
    adminBox.classList.add("hidden");
    return;
  }
  
  log("✅ Utilisateur connecté: " + user.email);
  log("Vérification du document Firestore pour UID: " + user.uid);
  
  try {
    const snap = await db.collection("users").doc(user.uid).get();
    
    log("Document existe? " + snap.exists);
    
    if(!snap.exists) {
      log("❌ Document utilisateur introuvable dans Firestore");
      log("⚠️ SOLUTION: Créez un document dans Firestore -> users -> " + user.uid);
      log("   Avec les champs: { isAdmin: true, pseudo: 'Admin' }");
      alert("Accès refusé : Document utilisateur introuvable");
      auth.signOut();
      return;
    }
    
    const userData = snap.data();
    log("Données utilisateur: " + JSON.stringify(userData));
    log("isAdmin = " + userData.isAdmin);
    
    if(userData.isAdmin !== true){
      log("❌ isAdmin n'est pas true");
      log("⚠️ SOLUTION: Modifiez le document Firestore -> users -> " + user.uid);
      log("   Ajoutez le champ: isAdmin: true");
      alert("Accès refusé : Vous n'êtes pas administrateur");
      auth.signOut();
      return;
    }
    
    // ✅ ADMIN OK
    log("✅✅✅ Accès admin autorisé!");
    loginBox.classList.add("hidden");
    adminBox.classList.remove("hidden");
    loadUsers();
    
  } catch(error) {
    log("❌ Erreur lors de la vérification: " + error.message);
    alert("Erreur: " + error.message);
    auth.signOut();
  }
});

// 📋 LOAD USERS
function loadUsers(){
  log("Chargement de la liste des utilisateurs...");
  
  db.collection("users").onSnapshot(snap => {
    log("📊 Nombre de documents dans 'users': " + snap.size);
    userList.innerHTML = "";
    let count = 0;
    
    snap.forEach(doc => {
      const u = doc.data();
      log("User " + doc.id + ": " + JSON.stringify(u));
      
      if(u.isAdmin) {
        log("  ↳ Ignoré (isAdmin=true)");
        return;
      }
      
      count++;
      userList.innerHTML += `
        <tr>
          <td>${doc.id}</td>
          <td><input id="p_${doc.id}" value="${u.pseudo || ''}"></td>
          <td><input id="s_${doc.id}" value="${u.maxScore || 0}"></td>
          <td><input id="k_${doc.id}" value="${u.skin || 1}"></td>
          <td><input id="n_${doc.id}" value="${u.niveauxDebloques || 0}"></td>
          <td><button onclick="saveUser('${doc.id}')">💾</button></td>
        </tr>
      `;
    });
    
    log("✅ " + count + " utilisateurs affichés dans le tableau");
  }, error => {
    log("❌ Erreur chargement users: " + error.message);
  });
}

// 💾 SAVE
function saveUser(id){
  log("Sauvegarde de l'utilisateur: " + id);
  
  db.collection("users").doc(id).update({
    pseudo: document.getElementById("p_" + id).value,
    maxScore: Number(document.getElementById("s_" + id).value),
    skin: Number(document.getElementById("k_" + id).value),
    niveauxDebloques: Number(document.getElementById("n_" + id).value)
  })
  .then(() => {
    log("✅ Utilisateur " + id + " sauvegardé");
    alert("Sauvegardé");
  })
  .catch(e => {
    log("❌ Erreur sauvegarde: " + e.message);
    alert(e.message);
  });
}

log("🚀 Application démarrée");
</script>
</body>
</html>
